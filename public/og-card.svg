<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="world" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4724b"/>
      <stop offset=".28" stop-color="#16342c"/>
      <stop offset=".72" stop-color="#102a24"/>
      <stop offset="1" stop-color="#b85b42"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="32%" r="46%">
      <stop offset="0" stop-color="#f2d44f" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#d4724b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#102a24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".7" fill="#f6efcd" fill-opacity=".08"/>
      <circle cx="6" cy="6" r=".55" fill="#102a24" fill-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#world)"/>
  <rect width="1200" height="630" fill="url(#sun)"/>
  <circle cx="980" cy="210" r="168" fill="none" stroke="#f2d44f" stroke-opacity=".18" stroke-width="10"/>
  <circle cx="980" cy="210" r="112" fill="none" stroke="#f2d44f" stroke-opacity=".14" stroke-width="10"/>
  <circle cx="980" cy="210" r="56" fill="none" stroke="#f2d44f" stroke-opacity=".12" stroke-width="10"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <text x="78" y="168" fill="#f2d44f" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="700" letter-spacing="6">BEERWOLF / WEB COMMISSIONS</text>
  <text x="74" y="292" fill="#f6efcd" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="86" font-weight="900" letter-spacing="-5">PERSONAL WEBSITES</text>
  <text x="76" y="378" fill="#f2d44f" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="46" font-weight="900" letter-spacing="-2">for furry identities</text>
  <rect x="78" y="412" width="228" height="6" fill="#d4724b"/>
  <text x="78" y="468" fill="#b6c37b" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20" letter-spacing="3">CONCEPT / DESIGN / CODE / LAUNCH</text>
