image: node:20-bookworm-slim

stages:
  - validate
  - test
  - deploy

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # Keep npm's cache inside the project so GitLab can restore it safely.
    - npm ci --cache .npm --prefer-offline

lint:
  stage: validate
  needs: []
  script:
    - npm run lint
    - npm run typecheck
    - npm run format:check

unit:
  stage: test
  needs: []
  script:
    - npm run test

build:
  stage: test
  needs:
    - lint
    - unit
  variables:
    # GitLab project pages are served from /landing/ until a custom domain is used.
    VITE_BASE_PATH: /landing/
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

e2e:
  stage: test
  needs:
    - lint
    - unit
  before_script:
    - npm ci --cache .npm --prefer-offline
    # Chromium is the single CI browser; responsive projects cover desktop and mobile.
    - npx playwright install --with-deps chromium
  script:
    - npm run test:e2e -- --project=chromium --project=mobile-chromium
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - e2e
  script:
    - test -f dist/index.html
  pages:
    publish: dist
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: $CI_PAGES_URL
