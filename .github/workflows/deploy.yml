name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beerwolf-production
  cancel-in-progress: false

env:
  # Public production SSH endpoint.
  DEPLOY_HOST: 85.137.89.253
  # Account that owns the Caddy deployment on the server.
  DEPLOY_USER: root
  # Standard SSH port exposed by the production server.
  DEPLOY_PORT: '22'
  # Custom domain is served from the site root.
  VITE_BASE_PATH: /
  # Public Formspree endpoint used by the contact form at build time.
  VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT }}
  # Umami website UUID baked into the production tracker script.
  VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
  # Tracker script URL. Empty values use Umami Cloud.
  VITE_UMAMI_SCRIPT_URL: ${{ vars.VITE_UMAMI_SCRIPT_URL }}
  # Hostnames allowed to send events. Empty values default to shop.beerwolf.site.
  VITE_UMAMI_DOMAINS: ${{ vars.VITE_UMAMI_DOMAINS }}
  # Optional Umami API host when the script is served from another origin.
  VITE_UMAMI_HOST_URL: ${{ vars.VITE_UMAMI_HOST_URL }}

jobs:
  deploy:
    name: Publish static site
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gates stay in ci.yml so a lint miss does not block a valid build.
      - name: Build production bundle
        run: npm run build

      - name: Configure SSH
        env:
          # Private key authorized for DEPLOY_USER on the production server.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned known_hosts lines for DEPLOY_HOST to prevent MITM attacks.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "DEPLOY_SSH_KEY is empty. Add the private key to the production environment secrets." >&2
            exit 1
          fi

          install -d -m 0700 "$HOME/.ssh"

          # GitHub often stores a PEM as one line, with literal \n, or wrapped
          # in quotes. OpenSSH then fails with "error in libcrypto".
          python3 - <<'PY'
          import os
          import pathlib
          import re

          raw = os.environ["DEPLOY_SSH_KEY"]
          raw = raw.strip().strip('"').strip("'").replace("\r\n", "\n").replace("\r", "\n")
          if "\n" not in raw and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          raw = raw.strip()
          lines = [line.strip() for line in raw.split("\n") if line.strip()]
          dest = pathlib.Path.home() / ".ssh" / "deploy_key"
          if len(lines) >= 3 and lines[0].startswith("-----BEGIN") and lines[-1].startswith("-----END"):
              dest.write_text("\n".join(lines) + "\n")
          else:
              match = re.match(
                  r"(-----BEGIN [^-]+-----)\s+(.+?)\s+(-----END [^-]+-----)$",
                  raw,
                  flags=re.S,
              )
              if match:
                  header, body, footer = match.groups()
                  body = re.sub(r"\s+", "", body)
                  wrapped = "\n".join(body[i : i + 70] for i in range(0, len(body), 70))
                  dest.write_text(f"{header}\n{wrapped}\n{footer}\n")
              else:
                  dest.write_text(raw if raw.endswith("\n") else raw + "\n")
          dest.chmod(0o600)
          PY

          if ! grep -qE '^-----BEGIN .*PRIVATE KEY-----$' "$HOME/.ssh/deploy_key"; then
            echo "DEPLOY_SSH_KEY is not a private key. Paste the PEM including BEGIN/END lines, not the .pub file." >&2
            exit 1
          fi

          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null; then
            echo "DEPLOY_SSH_KEY could not be parsed by OpenSSH (error in libcrypto)." >&2
            echo "Re-copy the key with real line breaks, no quotes and no passphrase:" >&2
            echo "  ssh-keygen -y -f beerwolf-deploy && pbcopy < beerwolf-deploy" >&2
            exit 1
          fi

          # Public half only. Compare this line with authorized_keys on the server.
          echo "Deploy public key (must exist in /root/.ssh/authorized_keys on ${DEPLOY_HOST}):" >&2
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >&2
          ssh-keygen -l -E sha256 -f "$HOME/.ssh/deploy_key" >&2

          known_hosts="$HOME/.ssh/known_hosts"
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts"
          else
            : > "$known_hosts"
          fi

          # ubuntu-latest prefers ed25519. A pin that only has ssh-rsa looks
          # like a known host and is then rejected. Always add live key types.
          echo "Adding live host keys for ${DEPLOY_HOST}." >&2
          ssh-keyscan -p "$DEPLOY_PORT" -T 10 "$DEPLOY_HOST" >> "$known_hosts"
          chmod 0644 "$known_hosts"

          if ! grep -vE '^[[:space:]]*(#|$)' "$known_hosts" | grep -q .; then
            echo "known_hosts has no host key lines for ${DEPLOY_HOST}." >&2
            echo "Save the output of: ssh-keyscan ${DEPLOY_HOST}" >&2
            exit 1
          fi

          # Force later ssh/scp calls to use this key and host-key file.
          cat > "$HOME/.ssh/config" <<EOF
          Host beerwolf-prod
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ${HOME}/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode yes
          EOF
          chmod 0600 "$HOME/.ssh/config"

      - name: Package website
        env:
          # A run attempt suffix makes manual reruns independently reversible.
          RELEASE_NAME: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          tar -czf "/tmp/beerwolf-${RELEASE_NAME}.tar.gz" -C dist .

      - name: Upload release and Caddy route
        env:
          # Must match the archive name generated in the package step.
          RELEASE_NAME: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if ! scp \
            -F "$HOME/.ssh/config" \
            "/tmp/beerwolf-${RELEASE_NAME}.tar.gz" \
            deploy/beerwolf.caddy \
            beerwolf-prod:/tmp/; then
            echo "Server rejected the deploy key. Add the public key printed in Configure SSH to /root/.ssh/authorized_keys on ${DEPLOY_HOST}." >&2
            echo "GitHub Deploy keys do not grant SSH into the VPS; only authorized_keys does." >&2
            echo "Verbose SSH follows; look for 'Offering public key' and PermitRootLogin." >&2
            ssh -F "$HOME/.ssh/config" -v beerwolf-prod true || true
            exit 255
          fi

      - name: Activate release
        env:
          # Immutable directory name and symlink target for this deployment.
          RELEASE_NAME: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh \
            -F "$HOME/.ssh/config" \
            beerwolf-prod \
            "RELEASE_NAME='${RELEASE_NAME}' bash -s" <<'DEPLOY'
          set -euo pipefail

          readonly SITE_ROOT="/root/caddy/site"
          readonly RELEASES_DIR="${SITE_ROOT}/beerwolf-releases"
          readonly RELEASE_DIR="${RELEASES_DIR}/${RELEASE_NAME}"
          readonly CURRENT_LINK="${SITE_ROOT}/beerwolf-current"
          readonly ARCHIVE="/tmp/beerwolf-${RELEASE_NAME}.tar.gz"
          # Host Caddy from the distro package reads this directory.
          readonly CADDYFILE="/etc/caddy/Caddyfile"
          readonly CADDY_SNIPPET="/etc/caddy/beerwolf.caddy"
          readonly CADDYFILE_BACKUP="/tmp/Caddyfile.beerwolf-backup"
          readonly SNIPPET_BACKUP="/tmp/beerwolf.caddy.backup"

          # Prefer the running listener. Starting a second caddy.service when
          # :80 is already taken exits with "bind: address already in use".
          reload_caddy() {
            if systemctl is-active --quiet caddy; then
              systemctl reload caddy || systemctl restart caddy
              return
            fi

            if curl -sf --max-time 2 http://127.0.0.1:2019/config/ >/dev/null; then
              caddy reload --config "$CADDYFILE"
              return
            fi

            if ss -lnt | grep -qE ':80([[:space:]]|$)'; then
              echo "caddy.service is inactive but :80 is already bound. Not starting a second Caddy." >&2
              ss -lntp | grep -E ':80|:443' >&2 || true
              echo "Stop that process or reload it so it reads ${CADDYFILE}." >&2
              return 1
            fi

            if ! systemctl cat caddy >/dev/null 2>&1; then
              echo "caddy.service is not installed." >&2
              return 1
            fi
            systemctl start caddy
          }

          install -d -m 0755 /etc/caddy "$RELEASES_DIR" "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          test -f "$RELEASE_DIR/index.html"

          # The host Caddyfile is owned by the bot (render-caddyfile.py):
          # global { email } plus shop-bot.beerwolf.site. This deploy only
          # writes the landing snippet and appends `import` once.
          if ! test -f "$CADDYFILE"; then
            echo "Host Caddyfile is missing at ${CADDYFILE}." >&2
            echo "Render it from the bot first (global options + shop-bot), then redeploy." >&2
            exit 1
          fi
          cp "$CADDYFILE" "$CADDYFILE_BACKUP"

          snippet_existed=false
          if test -f "$CADDY_SNIPPET"; then
            cp "$CADDY_SNIPPET" "$SNIPPET_BACKUP"
            snippet_existed=true
          fi
          install -m 0644 /tmp/beerwolf.caddy "$CADDY_SNIPPET"

          if ! awk '{ sub(/\r$/, "") } $1 == "import" && $2 ~ /(^|\/)beerwolf\.caddy$/ { found=1 } END { exit !found }' "$CADDYFILE"; then
            printf '\n# beerwolf landing (shop-landing). Keep this import when re-rendering Caddyfile.\nimport beerwolf.caddy\n' >> "$CADDYFILE"
          fi

          if ! command -v caddy >/dev/null; then
            echo "caddy is not on PATH. Install the host Caddy package before deploy." >&2
            exit 1
          fi

          if ! caddy validate --config "$CADDYFILE"; then
            cp "$CADDYFILE_BACKUP" "$CADDYFILE"
            if test "$snippet_existed" = true; then
              cp "$SNIPPET_BACKUP" "$CADDY_SNIPPET"
            else
              rm -f "$CADDY_SNIPPET"
            fi
            exit 1
          fi

          previous_release="$(readlink "$CURRENT_LINK" || true)"
          ln -sfn "beerwolf-releases/${RELEASE_NAME}" "${CURRENT_LINK}.next"
          mv -Tf "${CURRENT_LINK}.next" "$CURRENT_LINK"

          # Distro Caddy runs as user `caddy`. /root is 0700, so file_server
          # returns 403 while /healthz (respond) still succeeds.
          chmod 0711 /root /root/caddy
          chmod -R a+rX "$SITE_ROOT"
          if id caddy >/dev/null 2>&1 && command -v setfacl >/dev/null; then
            setfacl -m u:caddy:--x /root /root/caddy
            setfacl -R -m u:caddy:rX "$SITE_ROOT"
          fi

          if ! reload_caddy; then
            if test -n "$previous_release"; then
              ln -sfn "$previous_release" "${CURRENT_LINK}.next"
              mv -Tf "${CURRENT_LINK}.next" "$CURRENT_LINK"
            else
              rm -f "$CURRENT_LINK"
            fi
            cp "$CADDYFILE_BACKUP" "$CADDYFILE"
            if test "$snippet_existed" = true; then
              cp "$SNIPPET_BACKUP" "$CADDY_SNIPPET"
            else
              rm -f "$CADDY_SNIPPET"
            fi
            reload_caddy || true
            exit 1
          fi

          rm -f "$ARCHIVE" /tmp/beerwolf.caddy "$CADDYFILE_BACKUP" "$SNIPPET_BACKUP"
          DEPLOY

      - name: Verify production
        # Apex beerwolf.site still has a Timeweb A record (193.104.57.96).
        # This VPS is shop.beerwolf.site / shop-bot.beerwolf.site (85.137.89.253).
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://shop.beerwolf.site/healthz
